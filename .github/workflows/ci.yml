name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        run: |
          if ls test_*.py >/dev/null 2>&1; then
            python3 -m unittest discover -s . -p "test_*.py" -v
          else
            echo "No test files found yet; skipping."
          fi
